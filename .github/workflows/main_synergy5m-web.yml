name: Build and deploy Node.js app to Azure Web App - SYNERGY5M-WEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React application
        env:
          CI: false
        run: npm run build

      # 5. Remove node_modules before deployment
      # Azure App Service/Oryx will install production dependencies
      - name: Remove node_modules
        run: rm -rf node_modules

      # 6. Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EA104E2BB5C7403A86295DA8DAC4F5FD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A82C597EA0845D4AA6FB5C87AC38DF0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D80A6B415A2540FD955D8FC5A7B95289 }}

      # 7. Deploy application
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SYNERGY5M-WEB'
          package: .