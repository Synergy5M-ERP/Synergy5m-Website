name: Build and deploy Node.js app to Azure Web App - SYNERGY5M-WEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        env:
          CI: false
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir deploy

          cp package.json deploy/
          cp package-lock.json deploy/
          cp server.js deploy/
          cp db.js deploy/

          cp -r build deploy/

      - name: Show deployment package
        run: |
          echo "Deployment package:"
          find deploy -maxdepth 2 -type f | sort

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EA104E2BB5C7403A86295DA8DAC4F5FD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A82C597EA0845D4AA6FB5C87AC38DF0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D80A6B415A2540FD955D8FC5A7B95289 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SYNERGY5M-WEB'
          package: './deploy'